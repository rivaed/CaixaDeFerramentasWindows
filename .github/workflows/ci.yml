name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validar:
    name: Lint, testes e execucao real por modo
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $resultados = Invoke-ScriptAnalyzer -Path .\CaixaDeFerramentasWindows.ps1 -Severity Warning, Error
          $resultados | Format-Table RuleName, Severity, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
          if ($resultados) {
            Write-Error "$($resultados.Count) apontamento(s) do PSScriptAnalyzer."
            exit 1
          }

      - name: Pester (testes estruturais)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path .\tests -Output Detailed -CI

      # A partir da Fase 2, cada modo implementado ganha sua propria etapa de
      # execucao real abaixo (mesmo padrao ja usado nos 6 repos originais) - nao
      # colapsar todas num step so, para uma falha apontar exatamente qual modo quebrou.

      - name: Execucao real (Modo Faxina, simulacao no proprio runner)
        shell: powershell
        run: |
          .\CaixaDeFerramentasWindows.ps1 -Modo Faxina -NaoInterativo -Perfil Agressivo -Simular -CaminhoRelatorioJson .\teste_faxina.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Exit code inesperado: $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path .\teste_faxina.json)) {
            Write-Error 'O relatorio JSON esperado nao foi gerado.'
            exit 1
          }
          $relatorio = Get-Content .\teste_faxina.json -Raw | ConvertFrom-Json
          Write-Host ("Modo={0} VersaoWindowsDetectada={1} Simulacao={2} Itens={3}" -f $relatorio.Modo, $relatorio.VersaoWindowsDetectada, $relatorio.Simulacao, $relatorio.Itens.Count)
          if ($relatorio.Modo -ne 'Faxina') {
            Write-Error 'Campo Modo do relatorio deveria ser "Faxina".'
            exit 1
          }
          if (-not $relatorio.Simulacao) {
            Write-Error 'Campo Simulacao do relatorio deveria ser true (rodamos com -Simular).'
            exit 1
          }
          if ($relatorio.Itens.Count -ne 11) {
            Write-Error "Esperava 11 itens no relatorio (catalogo da Fase 2), veio $($relatorio.Itens.Count)."
            exit 1
          }
          Write-Host 'OK: -Modo Faxina (simulacao) executado com sucesso no runner real.'

      - name: Execucao real (Modo Debloat, simulacao no proprio runner)
        shell: powershell
        run: |
          .\CaixaDeFerramentasWindows.ps1 -Modo Debloat -NaoInterativo -Perfil Agressivo -Simular -CaminhoRelatorioJson .\teste_debloat.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Exit code inesperado: $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path .\teste_debloat.json)) {
            Write-Error 'O relatorio JSON esperado nao foi gerado.'
            exit 1
          }
          $relatorio = Get-Content .\teste_debloat.json -Raw | ConvertFrom-Json
          Write-Host ("Modo={0} VersaoWindowsDetectada={1} Simulacao={2} Itens={3}" -f $relatorio.Modo, $relatorio.VersaoWindowsDetectada, $relatorio.Simulacao, $relatorio.Itens.Count)
          if ($relatorio.Modo -ne 'Debloat') {
            Write-Error 'Campo Modo do relatorio deveria ser "Debloat".'
            exit 1
          }
          if (-not $relatorio.Simulacao) {
            Write-Error 'Campo Simulacao do relatorio deveria ser true (rodamos com -Simular).'
            exit 1
          }
          # 24 = itens Apps/Telemetria/Desempenho SEM SistemasAlvo (validos em
          # qualquer SO) - o piso garantido independente de o runner reportar
          # Win10/Win11/Desconhecido (ver CLAUDE.md sobre VersaoWindowsDetectada
          # no CI - nao e um bug o runner reportar Desconhecido).
          if ($relatorio.Itens.Count -lt 24) {
            Write-Error "Esperava pelo menos 24 itens no relatorio (itens sem SistemasAlvo), veio $($relatorio.Itens.Count)."
            exit 1
          }
          Write-Host 'OK: -Modo Debloat (simulacao) executado com sucesso no runner real.'

      - name: Execucao real (Modo Diagnostico, contra o proprio runner)
        shell: powershell
        run: |
          .\CaixaDeFerramentasWindows.ps1 -Modo Diagnostico -NaoInterativo -Dias 30 -CaminhoCsv .\teste_diagnostico.csv
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Exit code inesperado: $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path .\teste_diagnostico.csv)) {
            Write-Error 'O CSV esperado nao foi gerado.'
            exit 1
          }
          $linhas = Import-Csv .\teste_diagnostico.csv
          $linhas | Format-Table Verificacao, DataHora, Id, Provedor -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          if ($linhas.Count -lt 6) {
            Write-Error "Esperava pelo menos 6 linhas no CSV (uma por verificacao, minimo), veio $($linhas.Count)."
            exit 1
          }
          Write-Host 'OK: -Modo Diagnostico executado com sucesso no runner real (nunca eleva, so leitura).'

      - name: Execucao real (Modo AdminOculto, so -AcaoAdmin Status - nao altera a conta do runner)
        shell: powershell
        run: |
          .\CaixaDeFerramentasWindows.ps1 -Modo AdminOculto -NaoInterativo -AcaoAdmin Status
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Exit code inesperado: $LASTEXITCODE"
            exit 1
          }
          Write-Host 'OK: -Modo AdminOculto -AcaoAdmin Status executado com sucesso no runner real.'
